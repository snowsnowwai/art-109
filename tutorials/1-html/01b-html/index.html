<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Images</title>
    </head>

    <body>
        <section>
            <div>
                <img src="images/jade.jpg" alt="Jade!">
            </div>
        </section>
        <section>
            <h2>Responsive Images using srcset</h2>
                <img src="images/ash-fallback.jpg" alt="Ash!" 
                srcset="images/ash-640.jpg 640w,
                        images/ash-1280.jpg 1280w,
                        images/ash-1920.jpg 1920w">

        </section>
    </body>
</html>
